<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？夜市轉盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 木頭材質背景：利用多重漸層模擬木紋 */
            background-color: #4a2c1a;
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.05) 40px, rgba(0,0,0,0.05) 80px),
                linear-gradient(to right, #5d3a1a, #4a2c1a, #3d2215, #5d3a1a);
            background-size: 100% 100%;
            overflow-x: hidden;
            position: relative;
        }

        /* 疊加一層細微木頭紋理感 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'); /* 借用一個透明細紋路貼圖 */
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* 攤位遮雨棚 (紅白條紋) */
        .stall-roof {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: repeating-linear-gradient(
                45deg,
                #cc0000,
                #cc0000 20px,
                #ffffff 20px,
                #ffffff 40px
            );
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 40;
            border-bottom: 4px solid #8b0000;
        }

        /* 燈籠掛繩 */
        .lantern-string {
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            z-index: 35;
            pointer-events: none;
        }

        /* 小燈籠動畫 */
        @keyframes swing-small {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-8deg); }
        }

        .small-lantern {
            width: 30px;
            height: 40px;
            background: radial-gradient(circle at 50% 50%, #ffeb3b, #fbc02d);
            border-radius: 50% / 20%;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
            animation: swing-small 3s infinite ease-in-out;
            transform-origin: top center;
            border: 1px solid #f9a825;
        }

        .small-lantern::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 5px;
            background: #333;
        }

        .small-lantern::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 8px;
            background: #d32f2f;
        }

        /* 左右大燈籠搖晃動畫 */
        @keyframes swing {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }
        .lantern {
            animation: swing 4s infinite ease-in-out;
            transform-origin: top center;
            z-index: 45;
        }

        /* 按鈕脈衝 */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
        .btn-pulse {
            animation: pulse-gold 2s infinite;
        }

        /* 碎紙花動畫 */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: fall linear forwards;
            z-index: 60;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .stopper-shadow {
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5));
        }

        /* 配合木質背景優化霓虹效果 */
        .neon-text {
            text-shadow: 
                0 0 5px #ffeb3b,
                0 0 10px #ffeb3b,
                0 0 20px #ff9800,
                2px 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }

        /* 木牌質感的容器 */
        .wood-panel {
            background: #6d4c41;
            border: 4px solid #3e2723;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 15px rgba(0,0,0,0.4);
            border-radius: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white relative pt-16">

    <!-- 攤位遮雨棚 -->
    <div class="stall-roof"></div>

    <!-- 一排小燈籠 -->
    <div class="lantern-string">
        <div class="small-lantern" style="animation-delay: 0.1s;"></div>
        <div class="small-lantern" style="animation-delay: 0.4s;"></div>
        <div class="small-lantern" style="animation-delay: 0.2s;"></div>
        <div class="small-lantern" style="animation-delay: 0.6s;"></div>
        <div class="small-lantern" style="animation-delay: 0.3s;"></div>
        <div class="small-lantern" style="animation-delay: 0.5s;"></div>
        <div class="small-lantern" style="animation-delay: 0.1s;"></div>
        <div class="small-lantern hidden sm:block" style="animation-delay: 0.4s;"></div>
        <div class="small-lantern hidden sm:block" style="animation-delay: 0.2s;"></div>
    </div>

    <!-- 頂部兩側大燈籠 -->
    <div class="absolute top-[30px] w-full flex justify-between px-4 sm:px-12 pointer-events-none">
        <div class="lantern w-16 h-24 bg-red-600 rounded-lg border-t-4 border-b-4 border-yellow-400 flex items-center justify-center shadow-lg relative">
            <span class="text-yellow-300 font-bold text-2xl writing-vertical">夜</span>
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-1 h-6 bg-yellow-600"></div>
        </div>
        <div class="lantern w-16 h-24 bg-red-600 rounded-lg border-t-4 border-b-4 border-yellow-400 flex items-center justify-center shadow-lg relative" style="animation-delay: 0.8s;">
            <span class="text-yellow-300 font-bold text-2xl writing-vertical">市</span>
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-1 h-6 bg-yellow-600"></div>
        </div>
    </div>

    <main class="flex flex-col items-center w-full max-w-md px-4 z-20 mt-8">
        <div class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-black neon-text tracking-widest italic transform -rotate-2">
                吃什麼好呢？
            </h1>
            <p class="text-yellow-100 mt-2 text-lg font-bold bg-[#3e2723]/60 px-4 py-1 rounded-full backdrop-blur-sm border border-yellow-800/50">
                🎡 命運的夜市人生
            </p>
        </div>

        <!-- 轉盤容器 -->
        <div class="relative w-[300px] h-[300px] sm:w-[380px] sm:h-[380px] mb-8">
            <!-- 外框裝飾：改成深色鐵圈感 -->
            <div class="absolute inset-[-15px] rounded-full border-8 border-[#2d1b10] bg-[#3e2723] shadow-[0_15px_30px_rgba(0,0,0,0.6)]"></div>
            <!-- 加一層裝飾線 -->
            <div class="absolute inset-[-5px] rounded-full border-2 border-yellow-600/30 z-0"></div>

            <canvas id="wheel" width="380" height="380" class="rounded-full relative z-10 w-full h-full cursor-pointer shadow-2xl transform transition-transform duration-100"></canvas>

            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-gradient-to-br from-yellow-300 to-yellow-600 rounded-full shadow-[0_4px_10px_rgba(0,0,0,0.6)] z-20 flex items-center justify-center border-4 border-white">
                <span class="text-2xl">🥢</span>
            </div>

            <div class="stopper-shadow absolute -top-8 left-1/2 -translate-x-1/2 z-30">
                <svg width="50" height="60" viewBox="0 0 50 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25 60L5 10C5 10 10 0 25 0C40 0 45 10 45 10L25 60Z" fill="#FCD34D" stroke="#B45309" stroke-width="2"/>
                    <circle cx="25" cy="15" r="5" fill="#B45309"/>
                </svg>
            </div>
        </div>

        <button id="spinBtn" class="btn-pulse bg-gradient-to-b from-red-600 to-red-800 text-white font-black text-2xl py-4 px-12 rounded-full border-b-8 border-red-950 active:border-b-0 active:translate-y-2 transition-all shadow-xl hover:brightness-110 tracking-wider">
            開動！
        </button>

        <button onclick="toggleEdit()" class="mt-6 text-yellow-200/80 hover:text-yellow-100 text-sm underline transition-colors bg-[#3e2723]/60 px-3 py-1 rounded">
            老闆，換菜單！
        </button>
    </main>

    <!-- 結果彈窗 -->
    <div id="resultModal" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div class="bg-[#FFF8E7] p-8 rounded-2xl max-w-sm w-[90%] text-center border-8 border-[#5d4037] shadow-[0_0_50px_rgba(0,0,0,0.5)] transform scale-90 transition-transform duration-300 wood-panel" id="modalContent">
            <h3 class="text-xl text-yellow-100 font-bold mb-2">老闆說今天吃...</h3>
            <div id="resultText" class="text-4xl md:text-5xl font-black text-yellow-400 my-6 drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">
                牛肉麵
            </div>
            <p class="text-yellow-100/70 mb-6 text-sm">口水流下來了嗎？</p>
            <div class="flex gap-4 justify-center">
                <button onclick="closeModal()" class="bg-[#3e2723] hover:bg-[#2d1b10] text-yellow-100 font-bold py-2 px-6 rounded-lg transition-colors border border-yellow-900/50">
                    不喜歡
                </button>
                <button onclick="confirmChoice()" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition-colors border border-red-900">
                    好，來一份！
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯菜單彈窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-[#efebe9] p-6 rounded-xl max-w-md w-[90%] h-[80vh] flex flex-col border-4 border-[#3e2723]">
            <h3 class="text-xl text-[#3e2723] font-bold mb-4">編輯菜單 (一行一個)</h3>
            <textarea id="menuInput" class="flex-1 w-full border-2 border-[#d7ccc8] rounded-lg p-3 text-gray-800 focus:outline-none focus:border-[#5d4037] resize-none font-medium bg-white" placeholder="輸入食物名稱..."></textarea>
            <div class="mt-4 flex justify-end gap-3">
                <button onclick="toggleEdit()" class="text-gray-600 font-bold py-2 px-4">取消</button>
                <button onclick="saveMenu()" class="bg-[#5d4037] text-white font-bold py-2 px-6 rounded-lg">保存並更新</button>
            </div>
        </div>
    </div>

    <script>
        const colors = ['#d32f2f', '#f9a825', '#ef6c00', '#7b1fa2', '#2e7d32', '#1565c0', '#c2185b', '#00838f'];
        let foods = ["臭豆腐", "珍珠奶茶", "蚵仔煎", "地瓜球", "大腸包小腸", "鹽酥雞", "滷肉飯", "牛肉麵", "雞排", "藥燉排骨", "章魚燒", "潤餅", "火鍋", "甜不辣", "東山鴨頭", "烤玉米", "豆花", "蔥抓餅"];

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('resultModal');
        const modalContent = document.getElementById('modalContent');
        const resultText = document.getElementById('resultText');
        const editModal = document.getElementById('editModal');
        const menuInput = document.getElementById('menuInput');

        let dia = canvas.width;
        let rad = dia / 2;
        let PI = Math.PI;
        let TAU = 2 * PI;
        
        let arc = TAU / foods.length;
        let angVel = 0;
        let ang = 0;
        let isSpinning = false;
        let animationFrame = null;

        function draw() {
            arc = TAU / foods.length;
            ctx.clearRect(0, 0, dia, dia);
            foods.forEach((food, i) => {
                const angle = ang - PI / 2 + i * arc;
                ctx.save();
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(rad, rad);
                ctx.arc(rad, rad, rad, angle, angle + arc);
                ctx.lineTo(rad, rad);
                ctx.fill();
                
                // 畫扇形邊框
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.stroke();

                ctx.translate(rad, rad);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px 'Noto Sans TC'";
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 4;
                ctx.fillText(food, rad - 25, 6);
                ctx.restore();
            });
        }

        function rotate() {
            if (isSpinning) {
                angVel *= 0.985;
                if (angVel < 0.002) {
                    isSpinning = false;
                    angVel = 0;
                    cancelAnimationFrame(animationFrame);
                    showResult();
                }
            }
            ang += angVel;
            ang %= TAU; 
            draw();
            if (isSpinning) animationFrame = requestAnimationFrame(rotate);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            angVel = (Math.random() * 0.25) + 0.25; 
            rotate();
        }

        function showResult() {
            const index = Math.floor( (TAU - ang) / arc ) % foods.length;
            resultText.innerText = foods[index];
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-90');
                modalContent.classList.add('scale-100');
                createConfetti();
            }, 10);
        }

        spinBtn.addEventListener('click', spin);
        canvas.addEventListener('click', spin); 

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.querySelectorAll('.confetti').forEach(c => c.remove());
            }, 300);
        }

        function confirmChoice() {
            alert(`老闆！來一份「${resultText.innerText}」！`);
            closeModal();
        }

        function toggleEdit() {
            if (editModal.classList.contains('hidden')) {
                menuInput.value = foods.join('\n');
                editModal.classList.replace('hidden', 'flex');
            } else {
                editModal.classList.replace('flex', 'hidden');
            }
        }

        function saveMenu() {
            const newFoods = menuInput.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            if (newFoods.length < 2) return alert("請至少輸入兩種食物！");
            foods = newFoods;
            toggleEdit();
            draw(); 
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-10px';
                c.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(c);
            }
        }

        draw();
    </script>
</body>
</html>
